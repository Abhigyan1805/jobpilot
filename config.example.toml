# jobpilot configuration
# Copy this file to config.toml and edit. config.toml is git-ignored so your
# paths and answers never get committed.

[profile]
# Read-only master profile (single source of truth for resume facts).
path = "/mnt/d/LaTeX/resume/PROFILE.md"
# Read-only resume whose LaTeX preamble defines the style we preserve.
style_template = "/mnt/d/LaTeX/resume/Abhigyan_Resume_AI_ML.tex"
# LaTeX engine used to compile the tailored .tex to PDF.
pdflatex = "/mnt/d/LaTeX/MiKTeX/miktex/bin/x64/pdflatex.exe"
# Text extractor used for the PDF parseability check (ships with the engine).
pdftotext = "/mnt/d/LaTeX/MiKTeX/miktex/bin/x64/pdftotext.exe"
compile_timeout = 120

[output]
dir = "out"
database = "jobpilot.db"

# ---------------------------------------------------------------------------
# Discovery sources. Each is a public, unauthenticated read-only endpoint.
# Replace the example board tokens with the companies you care about.
# ---------------------------------------------------------------------------
[sources.greenhouse]
enabled = true
tokens = ["vercel", "canonical", "stripe"]

[sources.lever]
enabled = true
tokens = ["spotify"]

[sources.ashby]
enabled = true
tokens = ["openai", "ramp"]

[sources.workable]
enabled = true
tokens = ["skillshare"]

# Search-based sources: no tokens, no auth, just the approved public endpoints.
# Failures are isolated - one source failing never aborts the run.

# Himalayas: global remote board. A typed employment_type=Intern query plus a
# broader q=intern keyword query are merged (deduped by guid): the typed facet
# is a precision slice, never the only discovery path.
[sources.himalayas]
enabled = true
max_pages = 1
# keyword_max_pages = 1

# Unstop: India-native; robots.txt explicitly allows /api/public/*.
[sources.unstop]
enabled = true
max_pages = 2

# Workable's cross-company search (distinct from the per-account widget above).
# Undocumented endpoint; keep request rates low (robots sets ai-train=no).
[sources.workable_global]
enabled = true
max_pages = 2

# The Muse: free public API. A typed level=Internship query plus a broader
# location=India query (the API ignores keyword params) are merged and deduped
# by id, so the typed level facet is never the only discovery path.
# Note: its location=India parameter is loose; the hard location filter rechecks.
[sources.themuse]
enabled = true
max_pages = 2
# broad_max_pages = 1

# ---------------------------------------------------------------------------
# Manual link-out sources. These sites' terms forbid automation (or they block
# bots), so jobpilot NEVER scrapes or authenticates to them. It surfaces a saved
# search link, and you can add a posting you found there with
# `jobpilot link-out add`, after which the normal matching/tailoring runs and a
# ready-to-apply packet lands in the review queue. Nothing here is auto-applied.
# Override a search_url below; the defaults live in jobpilot/config.py.
# ---------------------------------------------------------------------------
[link_out]
enabled = true

# [link_out.sources.internshala]
# search_url = "https://internshala.com/internships/machine-learning-internship"

# Optional, disabled by default. Read-only, never authenticates, never applies.
# NOTE: reading LinkedIn this way is against their Terms of Service and is
# best-effort; it may stop working at any time. See README.
[linkedin]
enabled = false
keywords = "intern"
location = "India"
max_pages = 1
requests_per_second = 0.2
max_results = 25

# ---------------------------------------------------------------------------
# Hard filters
# ---------------------------------------------------------------------------
[filter]
allow_unknown_window = false     # an internship with no stated dates is scored and queued for review, never auto-applied
allow_onsite_abroad = false      # onsite roles outside India are rejected
allow_unknown_location = false   # a posting with no location is rejected
window_start_month = 1
window_end_month = 6

# ---------------------------------------------------------------------------
# Matching rubric (deterministic; ranks for review, does not predict outcomes)
# ---------------------------------------------------------------------------
[match]
shortlist_threshold = 0.42       # tailors + queues for review at/above this
strong_threshold = 0.68          # auto-applies at/above this (where a path exists)
# Auto-apply (`strong`) additionally requires role relevance >= this floor, so an
# unrelated internship cannot reach the auto-apply band on location/window alone.
# Role relevance scores title matches far above body mentions, so company
# boilerplate cannot establish relevance. Retarget the search by editing
# [match.target_terms] below (default: AI/ML, software, research).
strong_min_role_relevance = 0.5
require_parseable = true
min_keyword_survival = 0.5
max_projects = 4
include_positions = false
include_non_ai_experience = false
bold_metrics = true

# The search target. Role relevance is computed as overlap with these domains,
# with a title hit weighing far more than a body mention. Retargeting the tool
# means editing these terms and `strong_min_role_relevance` above.
# [match.target_terms]
# ai_ml = ["machine learning", "deep learning", "artificial intelligence", "ai engineer", "ai intern", "ai research", "ai scientist", "llm", "generative", "rag", "nlp", "pytorch", "tensorflow", "evaluation", "data science", "forecasting"]
# software = ["python", "software engineer", "backend", "api", "fastapi", "flask", "sql", "postgres", "data engineer", "docker"]
# research = ["research", "research scientist", "publication", "benchmark", "experiment"]

[match.weights]
skill_coverage = 0.45
role_relevance = 0.25
location_fit = 0.15
window_fit = 0.10
seniority_fit = 0.05

# ---------------------------------------------------------------------------
# Present: the browsable review surface (`jobpilot present`)
# ---------------------------------------------------------------------------
# Selection is presentation-only: it filters and orders what the pipeline
# already produced, using the same role relevance and matched skills. It never
# re-scores, invents resume content or submits.
[present]
# Page directory, resolved relative to [output].dir. Writes <out_dir>/index.html
# and copies each tailored PDF into <out_dir>/assets/ beside it.
out_dir = "present"
# A role is technical when its relevance in one of `technical_domains` reaches
# `min_role_relevance`. A `guarded_domains` domain ("research") only counts when
# the posting also matches a `core_skills` term, because "research" alone matches
# design/policy/market research too. Retarget the presented role set here.
min_role_relevance = 0.5
borderline_role_relevance = 0.4
technical_domains = ["ai_ml", "software", "research"]
guarded_domains = ["research"]
# Non-technical role keywords excluded outright (matched against the title as a
# whole-word phrase), so design, UX, communications, content, marketing, HR,
# recruiting, sales and non-technical product/operations roles are never
# presented even if they are India-eligible and in-window. Use phrases, not bare
# ambiguous words: "graphic design" excludes design roles but leaves "system
# design", and "business operations" leaves "machine learning operations".
# exclude_terms = ["graphic design", "marketing", "hr", "recruiting", "sales", ...]

# ---------------------------------------------------------------------------
# Applying
# ---------------------------------------------------------------------------
[apply]
enabled = true
auto_apply_strong = true
# Channels that submit automatically: email to an explicit, source-supplied
# application address (requires the SMTP block below). Without that SMTP block
# NOTHING is auto-submitted: every strong match is prepared as a link-out packet
# and queued instead. Greenhouse, Lever, Ashby and Workable have no documented,
# verifiable public application endpoint, so they are never submitted
# programmatically: each is prepared as a link-out packet (resume, cover letter,
# direct apply link, matched and gap JD keywords) and queued for one-click human
# submission. "auto" (default) uses email wherever an authorized address exists
# and queues everything else; "email" forces the email channel; "none" routes
# everything to review. An unknown value is rejected, never treated as a live
# submission path.
adapter = "auto"
daily_cap = 5
answers_file = "answers.toml"

# [apply.submission.smtp]
# host = "smtp.example.com"
# port = 587
# starttls = true
# from = "you@example.com"
# username = "you@example.com"
# password = "app-password-here"
#
# Used by adapter = "auto" (default) and adapter = "email". A structured
# apply-email from the source is required; this allowlist (optional) further
# narrows which recipients may be used. Free-text addresses in a job
# description are never used.
# email_allowlist = ["careers@example.com"]
