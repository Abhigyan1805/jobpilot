# jobpilot configuration
# Copy this file to config.toml and edit. config.toml is git-ignored so your
# paths and answers never get committed.

[profile]
# Read-only master profile (single source of truth for resume facts).
path = "/mnt/d/LaTeX/resume/PROFILE.md"
# Read-only resume whose LaTeX preamble defines the style we preserve.
style_template = "/mnt/d/LaTeX/resume/Abhigyan_Resume_AI_ML.tex"
# LaTeX engine used to compile the tailored .tex to PDF.
pdflatex = "/mnt/d/LaTeX/MiKTeX/miktex/bin/x64/pdflatex.exe"
# Text extractor used for the PDF parseability check (ships with the engine).
pdftotext = "/mnt/d/LaTeX/MiKTeX/miktex/bin/x64/pdftotext.exe"
compile_timeout = 120
# A student resume must fit this many pages. The pipeline measures the compiled
# PDF (form feeds in the pdftotext output) and, when over, drops the least
# relevant content deterministically and recompiles within `resume_fit_attempts`
# bounded attempts: the least relevant bullets first, then whole projects.
# Reduction never invents or rewrites a fact, and a variant that no longer
# extracts a required section is rejected as unreadable. The default covers
# every rung of the reduction ladder; lower it to bound compile cost on slow
# engines. If it still cannot fit, the posting is queued for review with the
# measured count and flagged on the `present` card.
resume_page_limit = 1
resume_fit_attempts = 9

[output]
dir = "out"
database = "jobpilot.db"

# ---------------------------------------------------------------------------
# Discovery sources. Each is a public, unauthenticated read-only endpoint.
# The list below is a verified starting set; replace or extend it with the
# companies you care about.
#
# Every token listed below was verified live read-only against its public board
# endpoint and returned at least one posting; counts at probe time are recorded
# in the captain's config (git-ignored) header note. A token that returns zero
# postings or 404 is not listed. Endpoints:
#   greenhouse  https://boards-api.greenhouse.io/v1/boards/<token>/jobs
#   lever       https://api.lever.co/v0/postings/<token>?mode=json
#   ashby       https://api.ashbyhq.com/posting-api/job-board/<token>
# The greenhouse and lever boards were expanded on 2026-09-27 (43 greenhouse + 10
# lever tokens; e.g. affirm 180, anthropic 618, spotify 79, qonto 38 postings at
# probe time). Note: api.ashbyhq.com/robots.txt returns HTTP 401 for every user
# agent and the enforced robots gate fails closed with no override, so the Ashby
# source is skipped at run time. The Ashby set below is the originally-verified
# 8 and no new Ashby tokens were added; unfetchable tokens add no companies.
# ---------------------------------------------------------------------------
[sources.greenhouse]
enabled = true
tokens = [
  # Core AI/ML, data and software boards with India or remote-friendly hiring.
  "rubrik", "stripe", "groww", "sigmoid", "databricks", "mongodb", "gitlab",
  "five9", "coinbase", "robinhood", "glance", "inmobi", "druva", "pubmatic",
  "highradius", "okta", "twilio", "samsara", "figma", "turing", "observeai",
  "neo4j", "deliveroo", "scaleai", "datadog", "elastic", "canonical", "vercel",
  "reddit", "dropbox", "affirm", "anthropic", "instacart", "pinterest",
  "cloudflare", "airbnb", "singlestore", "planetscale", "sofi", "slice",
  "hackerrank", "gleanwork", "newrelic", "yugabyte", "honeycomb", "pingcap",
  "mixpanel", "algolia", "discord", "gusto", "intercom", "amplitude",
  "netlify", "cockroachlabs", "asana", "udemy", "coursera", "chime",
  "lyft", "roblox", "duolingo", "adyen", "cabify", "dataiku", "labelbox",
  "snorkelai", "assemblyai", "truecaller", "launchdarkly", "pagerduty",
  "gemini", "block", "brex",
]

[sources.lever]
enabled = true
tokens = [
  "paytm", "zeta", "mindtickle", "meesho", "cred", "spotify", "toptal", "porter",
  "aircall", "qonto", "swile", "blablacar", "contentsquare", "superside", "matillion",
]

# Left at the originally-verified set. api.ashbyhq.com/robots.txt returns HTTP
# 401 and the enforced robots gate fails closed with no override, so this source
# is skipped at run time regardless of the token list; no new tokens were added.
[sources.ashby]
enabled = true
tokens = ["sarvam", "atlan", "cohere", "langchain", "llamaindex", "pinecone", "weaviate", "fireworks"]

[sources.workable]
enabled = true
tokens = ["skillshare"]

# Search-based sources: no tokens, no auth, just the approved public endpoints.
# Failures are isolated - one source failing never aborts the run.

# Himalayas: global remote board. A typed employment_type=Intern query plus a
# broader q=intern keyword query are merged (deduped by guid): the typed facet
# is a precision slice, never the only discovery path. Only the first page of
# each query is fetched and no `page` parameter is sent: the paged API path is
# robots-disallowed (`Disallow: /jobs*&page=`), so paging is not attempted.
[sources.himalayas]
enabled = true

# Unstop: India-native; robots.txt explicitly allows /api/public/*. The generic
# internships feed is recency-sorted and non-technical-dominated, so the
# server-side searchTerm keyword filter is run as well; the generic feed and one
# query per keyword are merged and deduped by id. Each keyword below was verified
# live read-only on 2026-09-27 to return real rows; the comment lists each
# slice's *new* postings on its first two pages after dedupe in a probe that
# fetched the full 30-page generic feed (242, totalling 575; the configured
# max_pages below is lower, and run-to-run counts drift slightly as inventory
# rotates). The first page is saturated at 10 rows for every keyword, so
# keyword_max_pages is 2. Override the keyword list:
[sources.unstop]
enabled = true
max_pages = 2
keyword_max_pages = 2
# keywords = [
#   "machine learning",        # 20
#   "artificial intelligence", # 19
#   "ai",                      # 20
#   "deep learning",           # 9
#   "ai ml",                   # 13
#   "generative ai",           # 18
#   "llm",                     # 19
#   "computer vision",         # 19
#   "nlp",                     # 11
#   "ml engineer",             # 17
#   "ai engineer",             # 16
#   "data science",            # 15
#   "data analyst",            # 17
#   "data engineer",           # 20
#   "software engineer",       # 20
#   "software development",    # 19
#   "python",                  # 20
#   "ai intern",               # 12
#   "ml intern",               # 10
#   "research intern",         # 19
# ]

# Workable's cross-company search (distinct from the per-account widget above).
# Undocumented endpoint; keep request rates low (robots sets ai-train=no).
[sources.workable_global]
enabled = true
max_pages = 2

# The Muse: free public API. A typed level=Internship query plus a broader
# location=India query (the API ignores keyword params) are merged and deduped
# by id, so the typed level facet is never the only discovery path. The typed
# Internship facet has only ~4 pages, so max_pages=4 captures its full depth.
# Note: its location=India parameter is loose; the hard location filter rechecks.
[sources.themuse]
enabled = true
max_pages = 4
# broad_max_pages = 1

# ---------------------------------------------------------------------------
# Manual link-out sources. These sites' terms forbid automation (or they block
# bots), so jobpilot NEVER scrapes or authenticates to them. It surfaces a saved
# search link, and you can add a posting you found there with
# `jobpilot link-out add`, after which the normal matching/tailoring runs and a
# ready-to-apply packet lands in the review queue. Nothing here is auto-applied.
# Override a search_url below; the defaults live in jobpilot/config.py.
# ---------------------------------------------------------------------------
[link_out]
enabled = true

# [link_out.sources.internshala]
# search_url = "https://internshala.com/internships/machine-learning-internship"

# Optional, disabled by default. Read-only, never authenticates, never applies.
# NOTE: reading LinkedIn this way is against their Terms of Service and is
# best-effort; it may stop working at any time. See README.
# keywords is a list of target queries (a single generic "intern" word returned
# only generic listings); each query is paged, then merged and deduped by id.
# The request rate stays deliberately low.
[linkedin]
enabled = false
keywords = [
    "machine learning intern",
    "AI intern",
    "data science intern",
    "research intern",
    "software engineer intern",
]
location = "India"
max_pages = 2
requests_per_second = 0.2
max_results = 100

# ---------------------------------------------------------------------------
# Hard filters
# ---------------------------------------------------------------------------
[filter]
allow_unknown_window = false     # an internship with no stated dates is scored and queued for review, never auto-applied
allow_onsite_abroad = false      # onsite roles outside India are rejected
allow_unknown_location = false   # a posting with no location is rejected
window_start_month = 1
window_end_month = 6

# Minimum monthly stipend (INR/month by design; the extractor reads only
# INR-marked amounts - ₹/Rs/INR, "15,000-18,000/ month", "1K"/"1.5K", "INR 6
# LPA" - and never invents an amount). A confirmed figure at or above this is
# shown in the main `present` list; a confirmed figure below it (including an
# "up to" cap that is itself below the floor), or an explicitly unpaid /
# commission-only posting, is dropped; a performance-conditioned stipend, an
# "up to" cap at or above the floor, or a posting whose stipend is not stated, is
# shown in a separate "Stipend not stated - verify" section rather than silently
# failing the floor.
stipend_floor = 30000

# Postings you have already applied to, excluded from `jobpilot present`
# entirely (matched by url or stable id/source+job_id, so a re-discovery is
# excluded while a new same-company/same-title posting is not). This is a filter,
# never a deletion from the store. Defaults to the shipped list; set it to "" to
# disable the exclusion entirely.
exclude_file = "data/applied-postings.toml"

# ---------------------------------------------------------------------------
# Matching rubric (deterministic; ranks for review, does not predict outcomes)
# ---------------------------------------------------------------------------
[match]
shortlist_threshold = 0.42       # tailors + queues for review at/above this
strong_threshold = 0.68          # auto-applies at/above this (where a path exists)
# Auto-apply (`strong`) additionally requires role relevance >= this floor, so an
# unrelated internship cannot reach the auto-apply band on location/window alone.
# Role relevance scores title matches far above body mentions, so company
# boilerplate cannot establish relevance. Retarget the search by editing
# [match.target_terms] below (default: AI/ML, software, research).
strong_min_role_relevance = 0.5
require_parseable = true
min_keyword_survival = 0.5
max_projects = 4
include_positions = false
include_non_ai_experience = false
bold_metrics = true

# The search target. Role relevance is computed as overlap with these domains,
# with a title hit weighing far more than a body mention. Retargeting the tool
# means editing these terms and `strong_min_role_relevance` above.
# [match.target_terms]
# ai_ml = ["machine learning", "deep learning", "artificial intelligence", "ai engineer", "ai intern", "ai research", "ai scientist", "llm", "generative", "rag", "nlp", "pytorch", "tensorflow", "evaluation", "data science", "forecasting"]
# software = ["python", "software engineer", "backend", "api", "fastapi", "flask", "sql", "postgres", "data engineer", "docker"]
# research = ["research", "research scientist", "publication", "benchmark", "experiment"]

[match.weights]
skill_coverage = 0.45
role_relevance = 0.25
location_fit = 0.15
window_fit = 0.10
seniority_fit = 0.05

# ---------------------------------------------------------------------------
# Present: the browsable review surface (`jobpilot present`)
# ---------------------------------------------------------------------------
# Selection is presentation-only: it filters and orders what the pipeline
# already produced, using the same role relevance and matched skills. It never
# re-scores, invents resume content or submits.
[present]
# Page directory, resolved relative to [output].dir. Writes <out_dir>/index.html
# and copies each tailored PDF into <out_dir>/assets/ beside it.
out_dir = "present"
# A role is technical when its relevance in one of `technical_domains` reaches
# `min_role_relevance`. A `guarded_domains` domain ("research") only counts when
# the posting also matches a `core_skills` term, because "research" alone matches
# design/policy/market research too. Retarget the presented role set here.
min_role_relevance = 0.5
borderline_role_relevance = 0.4
technical_domains = ["ai_ml", "software", "research"]
guarded_domains = ["research"]
# Non-technical role keywords excluded outright (matched against the title as a
# whole-word phrase), so design, UX, communications, content, marketing, HR,
# recruiting, sales and non-technical product/operations roles are never
# presented even if they are India-eligible and in-window. Use phrases, not bare
# ambiguous words: "graphic design" excludes design roles but leaves "system
# design", and "business operations" leaves "machine learning operations".
# exclude_terms = ["graphic design", "marketing", "hr", "recruiting", "sales", ...]

# ---------------------------------------------------------------------------
# Applying
# ---------------------------------------------------------------------------
[apply]
enabled = true
auto_apply_strong = true
# Channels that submit automatically: email to an explicit, source-supplied
# application address (requires the SMTP block below). Without that SMTP block
# NOTHING is auto-submitted: every strong match is prepared as a link-out packet
# and queued instead. Greenhouse, Lever, Ashby and Workable have no documented,
# verifiable public application endpoint, so they are never submitted
# programmatically: each is prepared as a link-out packet (resume, cover letter,
# direct apply link, matched and gap JD keywords) and queued for one-click human
# submission. "auto" (default) uses email wherever an authorized address exists
# and queues everything else; "email" forces the email channel; "none" routes
# everything to review. An unknown value is rejected, never treated as a live
# submission path.
adapter = "auto"
daily_cap = 5
answers_file = "answers.toml"

# [apply.submission.smtp]
# host = "smtp.example.com"
# port = 587
# starttls = true
# from = "you@example.com"
# username = "you@example.com"
# password = "app-password-here"
#
# Used by adapter = "auto" (default) and adapter = "email". A structured
# apply-email from the source is required; this allowlist (optional) further
# narrows which recipients may be used. Free-text addresses in a job
# description are never used.
# email_allowlist = ["careers@example.com"]

# ---------------------------------------------------------------------------
# robots.txt gate (enforced before any automated fetch)
# ---------------------------------------------------------------------------
# Each source host's robots.txt is read at most once per run and cached, and the
# verdict is computed for the concrete request path and query (not the host
# root). The gate fails closed: a host whose policy cannot be read, or a path
# the policy disallows, is skipped rather than fetched. An empty robots.txt is
# allow-all; a 404 means no published policy (permitted); longest-match wins with
# ties to Disallow; a Disallow for the agent or "*" blocks.
[robots]
enabled = true
agent = "jobpilot"
timeout = 12.0

# ---------------------------------------------------------------------------
# Deadline urgency and posting staleness (a past deadline closes the posting;
# urgency/staleness labels are display only)
# ---------------------------------------------------------------------------
[deadline]
closing_soon_days = 7   # a stored deadline this many days away is "closing soon"
stale_days = 30         # a posting published longer ago than this is flagged stale

# ---------------------------------------------------------------------------
# Application lifecycle (deterministic; no model, nothing sent)
# ---------------------------------------------------------------------------
[lifecycle]
followup_days = 10      # an open application quiet this long is due a follow-up
max_reminders = 2       # never chase more than twice
stale_days = 60         # an open application quiet this long sweeps to no_response
