[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Config-driven internship discovery, tailored resume generation and guarded auto-application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

# Ruff 0.16 expanded its default rule set from 59 to 413 rules. Pin the stable
# pre-0.16 default set so `ruff check .` stays deterministic across releases.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
